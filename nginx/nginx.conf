user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # =========================================================================
    # Upstream Clusters for Load Balancing
    # =========================================================================
    upstream backend_cluster {
        # least_conn algorithm directs traffic to the server with fewest active connections
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:5173;
        keepalive 16;
    }

    # =========================================================================
    # Server 1: HTTP -> HTTPS Redirection (Port 80)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Permanent redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # Server 2: HTTPS Reverse Proxy & Load Balancer (Port 443)
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;

        # Local generated SSL Certificate and Private Key
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS Protocols & Cipher Suites
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Preserve and pass Authorization Bearer token to backend
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # WebSocket support for frontend HMR and real-time updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Route Backend APIs to backend_cluster
        location ~ ^/(blogs|users|comments|votes|bookmarks|notifications|followers|search|swagger-ui|v3/api-docs|api) {
            proxy_pass http://backend_cluster;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Route Frontend Application to frontend_cluster
        location / {
            proxy_pass http://frontend_cluster;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

