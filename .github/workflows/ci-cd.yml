name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent duplicate / overlapping runs for the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Gate 1: Linting & Static Code Quality (Checkstyle + TypeScript)
  # ===========================================================================
  lint:
    name: 1. Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend Static Code Analysis (Checkstyle)
        run: |
          echo "=== Running Maven Checkstyle Static Analysis ==="
          mvn -f 00-starter/pom.xml checkstyle:check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react-app/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend-react-app
        run: npm ci

      - name: Frontend Static Analysis (TypeScript & Lint)
        working-directory: ./frontend-react-app
        run: |
          echo "=== Linting Frontend Application ==="
          npm run lint

  # ===========================================================================
  # Gate 2: Automated Testing (Depends on Gate 1)
  # ===========================================================================
  test:
    name: 2. Automated Testing
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests (JUnit 5 + Mockito)
        run: |
          echo "=== Running Backend Tests ==="
          mvn -f 00-starter/pom.xml test

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react-app/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend-react-app
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend-react-app
        run: |
          echo "=== Running Frontend Tests ==="
          npm test

      - name: Archive Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: 00-starter/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Gate 3: Security & Vulnerability Scanning (Blocks on Findings, Depends on Gate 2)
  # ===========================================================================
  scan:
    name: 3. Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Pre-populate Local Maven Dependency Cache
        run: |
          echo "=== Pre-populating ~/.m2 cache to avoid remote Maven Central 429 rate limits ==="
          mvn -f 00-starter/pom.xml dependency:resolve

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react-app/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend-react-app
        run: npm ci

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          skip-dirs: 'nginx/certs'
          skip-files: 'nginx/certs/server.key'

  # ===========================================================================
  # Gate 4: Build & Push Docker Images (Depends on Gate 3, Push only)
  # ===========================================================================
  build-and-push:
    name: 4. Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./00-starter
          file: ./00-starter/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blogaty-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blogaty-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react-app
          file: ./frontend-react-app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blogaty-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blogaty-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

